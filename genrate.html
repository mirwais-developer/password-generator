<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Genrator | JavaScript Project</title>
    <link rel="stylesheet" href="gentrate.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
</head>
<body>
    <div class="continer">
        <h1>Password Genrator</h1>
        <div class="inputbox"> 
            <input type="text" class="passBox" id="passBox" disabled>
  <span class="material-icons" id="copyicon">content_copy</span>
        </div>
        <input type="range" min="1" max="30" value="8" id="inputSlider">
        <div class="row">
            <p>Password Lenght</p>
            <span id="SliderVlaue">4</span>
        </div>
         <div class="row">
            <label for="lowercase">Include Lowercase Letter (a-z)</label>
            <input type="checkbox" name="lowercase" id="lowercase" checked>
         </div>
         <div class="row">
            <label for="uppercase">Include uppercase Letter (A-Z)</label>
            <input type="checkbox" name="uppercase" id="uppercase" checked>
         </div>
         <div class="row">
            <label for="numbers">Include Numbers (0-9)</label>
            <input type="checkbox" name="numbers" id="numbers" checked>
         </div>
         <div class="row">
            <label for="symbols">Include Symbols (@-*)</label>
            <input type="checkbox" name="symbols" id="symbols" checked>
         </div>
         <button class="genbtn" id="genbtn">Genrate Button</button>

    </div>
    <script src="genrate.js"></script>
    
</body>
</html>
